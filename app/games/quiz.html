  make(rand, i, opts) {
    if (i === 0 || !rand._order) {
      let pool = BANK.map((_, k) => k);
      if (opts.cat && opts.cat !== 'alle' && GK.mode !== 'lan') {
        const f = pool.filter(k => BANK[k][0] === opts.cat);
        if (f.length >= 10) pool = f;
      }
      rand._order = rand.shuffle(pool);
    }
