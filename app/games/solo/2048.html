<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;touch-action:none;user-select:none;padding:10px}
h1{font-size:1.2rem;font-weight:900;color:#FFD700;margin-bottom:8px;text-transform:uppercase;letter-spacing:2px}
.hud{display:flex;gap:16px;margin-bottom:14px}
.sc-box{background:#1a1a2e;border:1px solid rgba(255,215,0,.2);border-radius:10px;padding:8px 16px;text-align:center;min-width:80px}
.sc-lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:#888}
.sc-val{font-size:1.1rem;font-weight:900;color:#FFD700}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:rgba(255,215,0,.08);border-radius:12px;padding:10px;width:min(340px,92vw);aspect-ratio:1;border:2px solid rgba(255,215,0,.2)}
.cell{background:rgba(255,255,255,.04);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900;transition:all .1s;border:1px solid rgba(255,255,255,.05);aspect-ratio:1}
.v2{background:#1a3a2e;color:#4ade80;border-color:rgba(74,222,128,.2)}
.v4{background:#1a2e3a;color:#60a5fa;border-color:rgba(96,165,250,.2)}
.v8{background:#2e1a3a;color:#a78bfa;border-color:rgba(167,139,250,.2)}
.v16{background:#3a1a1a;color:#f87171;border-color:rgba(248,113,113,.2)}
.v32{background:#3a2a1a;color:#fb923c;border-color:rgba(251,146,60,.2)}
.v64{background:#2e2e00;color:#facc15;border-color:rgba(250,204,21,.2)}
.v128,.v256{background:linear-gradient(135deg,#2e1a00,#3a2800);color:#FFD700;border-color:rgba(255,215,0,.3)}
.v512,.v1024{background:linear-gradient(135deg,#1a0a2e,#2e1a3a);color:#c084fc;border-color:rgba(192,132,252,.4)}
.v2048{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;border-color:#FFD700;box-shadow:0 0 20px rgba(255,215,0,.5)}
.btns{display:flex;gap:8px;margin-top:14px}
.btn{padding:10px 22px;background:linear-gradient(135deg,#FFD700,#FFA500);border:none;border-radius:10px;color:#000;font-size:.88rem;font-weight:800;cursor:pointer;transition:.2s}
.btn:hover{transform:scale(1.04)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:10;display:none}
.ov.show{display:flex}
.ov-box{background:#1a1a2e;border:2px solid #FFD700;border-radius:16px;padding:28px 36px;text-align:center}
.ov-box h2{color:#FFD700;font-size:1.4rem;margin-bottom:8px}
.ov-box p{color:#888;margin-bottom:16px;font-size:.82rem}
</style></head>
<body>
<h1>🔢 2048</h1>
<div class="hud">
  <div class="sc-box"><div class="sc-lbl">Score</div><div class="sc-val" id="sc">0</div></div>
  <div class="sc-box"><div class="sc-lbl">Best</div><div class="sc-val" id="hi">0</div></div>
</div>
<div id="grid"></div>
<div class="btns"><button class="btn" onclick="init()">🔄 Neu</button></div>
<div class="ov" id="ov">
  <div class="ov-box">
    <h2 id="ov-t">Game Over</h2>
    <p id="ov-p"></p>
    <button class="btn" onclick="document.getElementById('ov').classList.remove('show');init()">▶ Nochmal</button>
  </div>
</div>
<script>
var board,sc,hi=+localStorage.getItem('2048hi')||0,sz=4;
document.getElementById('hi').textContent=hi;
function init(){
  board=Array.from({length:sz},()=>Array(sz).fill(0));sc=0;
  add();add();render();document.getElementById('ov').classList.remove('show');
}
function add(){
  var empty=[];
  for(var r=0;r<sz;r++)for(var c=0;c<sz;c++)if(!board[r][c])empty.push([r,c]);
  if(!empty.length)return;
  var[r,c]=empty[Math.floor(Math.random()*empty.length)];
  board[r][c]=Math.random()<.9?2:4;
}
function move(dr,dc){
  var moved=false;
  var rows=dr===1?[3,2,1,0]:dr===-1?[0,1,2,3]:[0,1,2,3];
  var cols=dc===1?[3,2,1,0]:dc===-1?[0,1,2,3]:[0,1,2,3];
  for(var ri=0;ri<sz;ri++){
    for(var ci=0;ci<sz;ci++){
      var r=rows[ri],c=cols[ci];
      if(!board[r][c])continue;
      var nr=r,nc=c;
      while(true){
        var tr=nr+dr,tc=nc+dc;
        if(tr<0||tr>=sz||tc<0||tc>=sz)break;
        if(board[tr][tc]===0){nr=tr;nc=tc;}
        else if(board[tr][tc]===board[r][c]&&!board[tr][tc]._merged){nr=tr;nc=tc;break;}
        else break;
      }
      if(nr!==r||nc!==c){
        if(board[nr][nc]===board[r][c]&&!board[nr][nc]._merged){
          board[nr][nc]=board[r][c]*2;board[nr][nc]._merged=true;
          sc+=board[nr][nc];
        }else board[nr][nc]=board[r][c];
        board[r][c]=0;moved=true;
      }
    }
  }
  // clear merge flags
  for(var r2=0;r2<sz;r2++)for(var c2=0;c2<sz;c2++)if(board[r2][c2]&&board[r2][c2]._merged)delete board[r2][c2]._merged;
  if(moved){
    if(sc>hi){hi=sc;localStorage.setItem('2048hi',hi);}
    document.getElementById('sc').textContent=sc;document.getElementById('hi').textContent=hi;
    add();render();checkEnd();
  }
}
function checkEnd(){
  for(var r=0;r<sz;r++)for(var c=0;c<sz;c++)if(board[r][c]===2048){win();return;}
  for(var r2=0;r2<sz;r2++)for(var c2=0;c2<sz;c2++){
    if(!board[r2][c2])return;
    if(r2+1<sz&&board[r2+1][c2]===board[r2][c2])return;
    if(c2+1<sz&&board[r2][c2+1]===board[r2][c2])return;
  }
  document.getElementById('ov-t').textContent='😢 Game Over';
  document.getElementById('ov-p').textContent='Score: '+sc;
  document.getElementById('ov').classList.add('show');
}
function win(){
  document.getElementById('ov-t').textContent='🏆 2048 erreicht!';
  document.getElementById('ov-p').textContent='Fantastisch! Score: '+sc;
  document.getElementById('ov').classList.add('show');
}
function render(){
  var g=document.getElementById('grid');
  g.innerHTML=board.flat().map(function(v){
    var cls='cell'+(v?' v'+v:'');
    return '<div class="'+cls+'">'+(v||'')+'</div>';
  }).join('');
}
document.addEventListener('keydown',function(e){
  var m={'ArrowUp':[-1,0],'ArrowDown':[1,0],'ArrowLeft':[0,-1],'ArrowRight':[0,1],'w':[-1,0],'s':[1,0],'a':[0,-1],'d':[0,1]};
  var v=m[e.key];if(v){e.preventDefault();move(v[0],v[1]);}
});
var tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy))move(0,dx>0?1:-1);else move(dy>0?1:-1,0);
});
init();
</script></body></html>
