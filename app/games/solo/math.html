<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mathe-Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:18px;padding:20px;user-select:none}
h1{color:#FFD700;font-size:1.3rem;letter-spacing:2px}
.box{background:#1a1a2e;border:2px solid rgba(255,215,0,.25);border-radius:20px;padding:32px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:18px}
.question{font-size:2.4rem;font-weight:900;color:#FFD700;min-height:3.5rem;display:flex;align-items:center;justify-content:center}
.timer-bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,#e74c3c,#FFD700);border-radius:3px;transition:width .1s linear}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{padding:16px;background:rgba(255,215,0,.07);border:2px solid rgba(255,215,0,.3);border-radius:14px;font-size:1.3rem;font-weight:800;cursor:pointer;color:#fff;transition:all .2s}
.ans:hover{background:rgba(255,215,0,.18);border-color:var(--gold,#FFD700)}
.ans.correct{background:rgba(46,204,113,.25);border-color:#2ecc71;color:#2ecc71}
.ans.wrong  {background:rgba(231,76,60,.25);border-color:#e74c3c;color:#e74c3c}
.stats{display:flex;justify-content:space-between;font-size:.82rem;color:#888}
.stats b{color:#FFD700}
.diff{display:flex;gap:8px;justify-content:center}
.d-btn{padding:8px 18px;background:rgba(255,215,0,.06);border:1.5px solid rgba(255,215,0,.25);border-radius:9px;color:#888;cursor:pointer;font-size:.8rem;font-weight:700}
.d-btn.active{background:var(--gold,#FFD700);color:#000;border-color:transparent}
button.main{padding:12px 28px;background:linear-gradient(135deg,#FFD700,#FFA500);border:none;border-radius:12px;color:#000;font-weight:800;cursor:pointer;font-size:1rem}
button.out{background:rgba(255,215,0,.1);border:1.5px solid rgba(255,215,0,.3);color:#FFD700;padding:10px 20px;border-radius:10px;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<h1>🔢 Mathe-Quiz</h1>
<div class="box" id="box">
  <div class="diff">
    <button class="d-btn active" onclick="setDiff(1,this)">Leicht</button>
    <button class="d-btn" onclick="setDiff(2,this)">Mittel</button>
    <button class="d-btn" onclick="setDiff(3,this)">Schwer</button>
  </div>
  <div class="stats">Punkte: <b id="sc">0</b> &nbsp; Frage: <b id="qn">0</b>/10 &nbsp; Highscore: <b id="hi">0</b></div>
  <div class="timer-bar"><div class="timer-fill" id="tfill" style="width:100%"></div></div>
  <div class="question" id="q">Bereit?</div>
  <div class="answers" id="ans"></div>
  <button class="main" id="start-btn" onclick="startGame()">▶ Start</button>
</div>
<button class="out" onclick="if(window.top!==window.self)window.top.postMessage({type:'openPage',url:'SPIELE.html',label:'🎮 Spiele'},'*')">✕ Zurück</button>
<script>
let diff=1,sc=0,qn=0,timer,timeLeft,locked=false;
const MAX=10,TIME=15;
function hi(){return parseInt(localStorage.getItem('math_hi')||'0');}
function setDiff(d,btn){diff=d;document.querySelectorAll('.d-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function mkQ(){
  const ops=['+','-','×'];
  const d=diff;
  const max=d===1?12:d===2?50:200;
  const op=d===1?ops[Math.floor(Math.random()*2)]:ops[Math.floor(Math.random()*3)];
  let a=Math.floor(Math.random()*max)+1,b=Math.floor(Math.random()*max)+1,ans;
  if(op==='-'){if(a<b)[a,b]=[b,a];}
  if(op==='×'){a=Math.floor(Math.random()*(d===1?10:d===2?15:25))+1;b=Math.floor(Math.random()*(d===1?10:d===2?15:25))+1;}
  if(op==='+')ans=a+b;else if(op==='-')ans=a-b;else ans=a*b;
  return {q:`${a} ${op} ${b} = ?`,ans};
}
function rndAnswers(correct){
  const s=new Set([correct]);
  while(s.size<4){const off=Math.floor(Math.random()*20)-10;if(correct+off!==correct&&correct+off>=-999)s.add(correct+off);}
  return [...s].sort(()=>Math.random()-.5);
}
function startGame(){
  sc=0;qn=0;locked=false;
  document.getElementById('start-btn').style.display='none';
  nextQ();
}
function nextQ(){
  if(qn>=MAX){endGame();return;}
  qn++;locked=false;
  const {q,ans}=mkQ();
  document.getElementById('q').textContent=q;
  document.getElementById('qn').textContent=qn;
  const choices=rndAnswers(ans);
  document.getElementById('ans').innerHTML=choices.map(c=>`<button class="ans" onclick="check(this,${c},${ans})">${c}</button>`).join('');
  timeLeft=TIME;startTimer(ans);
}
function check(btn,val,correct){
  if(locked)return;locked=true;clearInterval(timer);
  if(val===correct){btn.classList.add('correct');sc+=Math.max(1,timeLeft)*diff;document.getElementById('sc').textContent=sc;}
  else{btn.classList.add('wrong');document.querySelectorAll('.ans').forEach(b=>{if(+b.textContent===correct)b.classList.add('correct');});}
  setTimeout(nextQ,1000);
}
function startTimer(correct){
  clearInterval(timer);
  const step=100/TIME;
  timer=setInterval(()=>{
    timeLeft-=0.1;document.getElementById('tfill').style.width=Math.max(0,timeLeft/TIME*100)+'%';
    if(timeLeft<=0){clearInterval(timer);if(!locked){locked=true;document.querySelectorAll('.ans').forEach(b=>{if(+b.textContent===correct)b.classList.add('correct');});setTimeout(nextQ,800);}}
  },100);
}
function endGame(){
  const best=Math.max(sc,hi());localStorage.setItem('math_hi',best);
  document.getElementById('hi').textContent=best;
  document.getElementById('q').textContent=`🏆 ${sc} Punkte!`;
  document.getElementById('ans').innerHTML='';
  document.getElementById('tfill').style.width='0%';
  document.getElementById('start-btn').style.display='';
  document.getElementById('start-btn').textContent='↻ Nochmal';
}
document.getElementById('hi').textContent=hi();
</script>
</body>
</html>
