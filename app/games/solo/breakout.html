<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breakout</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;touch-action:none;user-select:none}
h1{font-size:1.2rem;font-weight:900;color:#FFD700;margin-bottom:6px;text-transform:uppercase;letter-spacing:2px}
.hud{display:flex;gap:20px;margin-bottom:8px;font-size:.82rem;color:#888}.hud b{color:#FFD700}
canvas{border:2px solid rgba(255,215,0,.3);border-radius:6px;background:#111;display:block;max-width:min(480px,98vw);cursor:none}
p.info{font-size:.72rem;color:#555;margin-top:6px;text-align:center}
</style></head>
<body>
<h1>🧱 Breakout</h1>
<div class="hud">Score: <b id="sc">0</b> &nbsp; Leben: <b id="lv">3</b> &nbsp; Level: <b id="ll">1</b></div>
<canvas id="c" width="480" height="360"></canvas>
<p class="info">Maus / Touch bewegt Schläger · Enter / Tap startet</p>
<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=cv.width,H=cv.height;
var PAD_W=80,PAD_H=10,BALL_R=7;
var pad={x:W/2-PAD_W/2,spd:0};
var ball={x:W/2,y:H-60,vx:4,vy:-4};
var bricks=[],sc=0,lives=3,level=1,running=false,launched=false;
var ROWS=4,COLS=10,B_W=W/COLS-4,B_H=16;
var ROW_COLORS=['#e74c3c','#fb923c','#FFD700','#4ade80','#60a5fa','#a78bfa'];

function initBricks(){
  bricks=[];
  var rows=ROWS+Math.min(level-1,4);
  for(var r=0;r<rows;r++)for(var c=0;c<COLS;c++){
    bricks.push({x:2+c*(B_W+4),y:40+r*(B_H+4),w:B_W,h:B_H,alive:true,color:ROW_COLORS[r%ROW_COLORS.length],hp:r<2&&level>3?2:1});
  }
}
function start(){
  sc=0;lives=3;level=1;launched=false;
  document.getElementById('sc').textContent=0;document.getElementById('lv').textContent=3;document.getElementById('ll').textContent=1;
  pad.x=W/2-PAD_W/2;ball.x=W/2;ball.y=H-60;
  initBricks();running=true;launch();
}
function launch(){
  var a=(Math.random()*.6+.2)*Math.PI;var spd=4+level;
  ball.vx=Math.cos(a)*spd;ball.vy=-Math.abs(Math.sin(a))*spd;launched=true;
}

function tick(){
  if(!running||!launched)return;
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x-BALL_R<=0){ball.x=BALL_R;ball.vx*=-1;}
  if(ball.x+BALL_R>=W){ball.x=W-BALL_R;ball.vx*=-1;}
  if(ball.y-BALL_R<=0){ball.y=BALL_R;ball.vy*=-1;}
  // Pad collision
  if(ball.y+BALL_R>=H-30-PAD_H&&ball.y+BALL_R<=H-20&&ball.x>=pad.x&&ball.x<=pad.x+PAD_W){
    ball.vy=-Math.abs(ball.vy);var rel=(ball.x-(pad.x+PAD_W/2))/(PAD_W/2);ball.vx=rel*6;ball.y=H-30-PAD_H-BALL_R;
  }
  // Brick collision
  var broken=false;
  bricks.forEach(function(b){
    if(!b.alive)return;
    if(ball.x+BALL_R>b.x&&ball.x-BALL_R<b.x+b.w&&ball.y+BALL_R>b.y&&ball.y-BALL_R<b.y+b.h){
      b.hp--;if(b.hp<=0)b.alive=false;
      var ov_left=ball.x+BALL_R-b.x,ov_right=b.x+b.w-ball.x+BALL_R,ov_top=ball.y+BALL_R-b.y,ov_bot=b.y+b.h-ball.y+BALL_R;
      var min=Math.min(ov_left,ov_right,ov_top,ov_bot);
      if(min===ov_left||min===ov_right)ball.vx*=-1;else ball.vy*=-1;
      if(b.hp<=0){sc+=10+level*2;document.getElementById('sc').textContent=sc;}broken=true;
    }
  });
  // Level up
  if(bricks.every(b=>!b.alive)){level++;document.getElementById('ll').textContent=level;initBricks();launched=false;ball.x=W/2;ball.y=H-60;setTimeout(launch,800);}
  // Ball lost
  if(ball.y>H+20){lives--;document.getElementById('lv').textContent=lives;if(lives<=0){running=false;}else{launched=false;ball.x=W/2;ball.y=H-60;setTimeout(launch,600);}}
  draw();
}
function draw(){
  ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
  bricks.forEach(function(b){
    if(!b.alive)return;
    var alpha=b.hp>1?1:.85;
    ctx.fillStyle=b.color;ctx.globalAlpha=alpha;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(b.x,b.y,b.w,3);
    ctx.globalAlpha=1;
  });
  // Pad
  var pg=ctx.createLinearGradient(pad.x,0,pad.x+PAD_W,0);pg.addColorStop(0,'#FFD700');pg.addColorStop(1,'#FFA500');
  ctx.fillStyle=pg;ctx.beginPath();ctx.roundRect(pad.x,H-30,PAD_W,PAD_H,5);ctx.fill();
  // Ball
  var bg=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,BALL_R);bg.addColorStop(0,'#fff');bg.addColorStop(1,'#aaa');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.fill();
  if(!running){
    ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#FFD700';ctx.font='bold 1.4rem sans-serif';ctx.textAlign='center';
    ctx.fillText(lives<=0?'Game Over':'🧱 Breakout',W/2,H/2-20);
    ctx.fillStyle='#888';ctx.font='.8rem sans-serif';
    ctx.fillText('Enter / Tap zum Starten',W/2,H/2+10);
    if(lives<=0){ctx.fillStyle='rgba(255,215,0,.7)';ctx.fillText('Score: '+sc,W/2,H/2+35);}
  }
}
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x,y+r);this.arcTo(x,y,x+r,y,r);this.closePath();};

cv.addEventListener('mousemove',function(e){var r=cv.getBoundingClientRect();var x=(e.clientX-r.left)*(W/cv.clientWidth);pad.x=Math.max(0,Math.min(W-PAD_W,x-PAD_W/2));});
cv.addEventListener('touchmove',function(e){e.preventDefault();var r=cv.getBoundingClientRect();var x=(e.touches[0].clientX-r.left)*(W/cv.clientWidth);pad.x=Math.max(0,Math.min(W-PAD_W,x-PAD_W/2));},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!running)start();}if(e.key==='ArrowLeft')pad.x=Math.max(0,pad.x-18);if(e.key==='ArrowRight')pad.x=Math.min(W-PAD_W,pad.x+18);});
cv.addEventListener('click',()=>{if(!running)start();});
setInterval(tick,16);draw();
</script></body></html>
