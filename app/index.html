<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MediaCenter</title>
<meta name="theme-color" content="var(--acc)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MediaCenter">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/images/icons/icon-192.png">
<link rel="icon" href="/images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/desktop-shell.css">
<link rel="stylesheet" href="/css/remote.css">
<script src="/js/theme.js"></script>
<style>
@import url('/fonts/fonts.css');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#06080F;--card:#0E1120;--hover:#161928;--bg-rgb:6,8,15;--card-rgb:14,17,32;--bg2:#1a1a2e;--bg2s:#0b1020;
  --acc:#22D3EE;--acc2:#0891B2;--acc-rgb:34,211,238;--acc2-rgb:8,145,178;--hl:#F59E0B;--hl2:#D97706;--hl-rgb:245,158,11;
  --gold:var(--acc);--gold2:var(--acc2);--glow:rgba(var(--acc-rgb),.22);
  --amber:var(--hl);--amber2:var(--hl2);--amber-glow:rgba(var(--hl-rgb),.18);
  --txt:#E2E8F8;--sub:#5B6882;--txt-rgb:226,232,248;--sub2:#AEB8CF;--border:rgba(var(--acc-rgb),.12);
  --red:#F43F5E;--green:#10B981;--rad:12px;
  --font-body:'Outfit','MC Symbols','MC Emoji','Segoe UI Variable Text','Segoe UI',sans-serif;
  --font-display:'Syne','MC Symbols','MC Emoji','Bahnschrift','Trebuchet MS',sans-serif;
}
html,body{overflow-x:hidden;height:100%;height:100dvh;background:var(--bg);color:var(--txt);font-family:var(--font-body);overscroll-behavior:none;}
.app{height:100vh;height:100dvh;display:flex;overflow:hidden;}
.sidebar{width:60px;background:linear-gradient(180deg,#0A0D1A,#060810);border-right:1px solid rgba(var(--acc-rgb),.1);transition:width .25s ease;display:flex;flex-direction:column;padding-top:10px;flex-shrink:0;z-index:10;height:100%;overflow-y:auto;overflow-x:hidden;}
.sidebar.open{width:165px;}
.sidebar::-webkit-scrollbar{width:2px;}.sidebar::-webkit-scrollbar-thumb{background:rgba(var(--acc-rgb),.15);border-radius:1px;}
.sidebar-toggle{background:none;border:none;color:rgba(var(--acc-rgb),.6);font-size:1.4rem;cursor:pointer;margin:0 auto 15px;padding:4px 8px;border-radius:6px;transition:background .2s;}
.sidebar-toggle:hover{background:rgba(var(--acc-rgb),.08);}
.sidebar a,.sidebar button.nav-item{display:flex;align-items:center;gap:10px;padding:10px;color:var(--sub);text-decoration:none;transition:.2s;white-space:nowrap;background:none;border:none;cursor:pointer;width:100%;font-size:1rem;font-family:inherit;position:relative;}
.sidebar a:hover,.sidebar button.nav-item:hover{background:rgba(var(--acc-rgb),.06);color:var(--gold);}
.sidebar a.active,.sidebar button.nav-item.active{background:rgba(var(--acc-rgb),.1);color:var(--gold);}
.sidebar a.active::before,.sidebar button.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:linear-gradient(180deg,var(--gold),var(--gold2));border-radius:0 3px 3px 0;box-shadow:0 0 8px var(--glow);}
.sidebar a span,.sidebar button.nav-item span.nav-label{display:none;}
.sidebar.open a span,.sidebar.open button.nav-item span.nav-label{display:inline;}
.nav-icon{font-size:1.2rem;min-width:22px;text-align:center;}
.sidebar-rmt-spacer{flex:1;min-height:6px;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.ctrl-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid rgba(var(--acc-rgb),.12);background:linear-gradient(180deg,rgba(10,13,26,.98),rgba(4,6,14,.97));z-index:20;position:relative;}
.ctrl-bar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--acc-rgb),.2) 30%,rgba(var(--hl-rgb),.14) 60%,transparent);pointer-events:none;}
.ctrl-logo{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:2.5px;font-family:var(--font-display);background:linear-gradient(135deg,var(--amber),var(--amber2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;flex-shrink:0;}
.ctrl-spacer{flex:1;min-width:8px;align-self:stretch;}
.ctrl-brand{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0}
.ctrl-brand-logo{width:32px;height:32px;flex-shrink:0;filter:drop-shadow(0 3px 10px rgba(var(--acc-rgb),.3))}
.ctrl-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);color:var(--sub2,rgba(var(--txt-rgb),.72));font-size:.7rem;line-height:1.2;white-space:nowrap;flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ctrl-pill.addr{font-family:ui-monospace,Consolas,'MC Symbols','MC Emoji',monospace;cursor:copy}
.ctrl-pill.addr::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--hl);flex-shrink:0}
.ctrl-pill.addr.live::before{background:var(--green);box-shadow:0 0 8px rgba(16,185,129,.7)}
.desktop-actions{display:flex;align-items:center;gap:4px;margin-left:6px;padding-left:8px;border-left:1px solid rgba(255,255,255,.07)}
.desktop-actions[hidden]{display:none}
.desktop-window-btn{width:34px;height:30px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--sub2,rgba(var(--txt-rgb),.75));display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.desktop-window-btn:hover{background:rgba(255,255,255,.09);color:var(--txt)}
.desktop-window-btn.close:hover{background:rgba(244,63,94,.85);color:#fff}
.desktop-window-btn svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none}
/* Desktop-App: die Leiste ist gleichzeitig die Titelleiste (Fenster ziehen) */
body.desktop-app .ctrl-bar{-webkit-app-region:drag;min-height:48px}
body.desktop-app .ctrl-bar button,body.desktop-app .ctrl-bar input,body.desktop-app .ctrl-bar .ctrl-vol,body.desktop-app .ctrl-bar .ctrl-brand,body.desktop-app .ctrl-bar .ctrl-pill{-webkit-app-region:no-drag}
@media(max-width:900px){#desktop-section-pill{display:none}}
@media(max-width:700px){.ctrl-pill.addr{display:none}}
.ctrl-vol{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.ctrl-vol-icon{font-size:.85rem;cursor:pointer;color:rgba(var(--acc-rgb),.5);transition:color .2s;line-height:1;}
.ctrl-vol-icon:hover{color:var(--gold);}
.ctrl-vol-slider{-webkit-appearance:none;appearance:none;width:80px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;outline:none;cursor:pointer;}
.ctrl-vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:0 0 5px var(--glow);}
.ctrl-vol-slider::-moz-range-thumb{width:11px;height:11px;border-radius:50%;border:none;background:var(--gold);cursor:pointer;}
.ctrl-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border:1px solid rgba(var(--acc-rgb),.18);background:rgba(var(--acc-rgb),.05);color:rgba(var(--acc-rgb),.7);border-radius:9px;cursor:pointer;font-size:.72rem;font-weight:700;transition:all .18s;white-space:nowrap;font-family:inherit;min-height:30px;}
.ctrl-btn:hover{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border-color:transparent;box-shadow:0 3px 12px var(--glow);}
.ctrl-btn .ci{font-size:.9rem;display:inline-block;transition:transform .25s;}
.ctrl-btn:hover .ci{transform:scale(1.15);}
.ctrl-btn.active{background:rgba(var(--acc-rgb),.14);border-color:rgba(var(--acc-rgb),.4);color:var(--gold);}
@media(max-width:1100px){.ctrl-btn .btn-label{display:none;}}
@media(max-width:560px){.ctrl-vol-slider{width:55px;}.ctrl-logo{display:none;}}
@media(max-width:400px){.ctrl-vol-slider{width:42px;}.ctrl-btn{padding:4px 7px;min-height:26px;font-size:.66rem;}.ctrl-bar{gap:5px;}}
.content-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;border:1px solid rgba(var(--acc-rgb),.04);box-shadow:inset 0 0 60px rgba(0,0,0,.25);}
.content-area::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;box-shadow:inset 0 0 80px rgba(0,0,0,.18);border-radius:2px;}
#home-screen{flex:1;display:flex;justify-content:center;align-items:center;padding:30px;position:relative;}
#home-screen::before{content:'';position:absolute;inset:0;z-index:51;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 5px,rgba(0,0,0,.025) 5px,rgba(0,0,0,.025) 6px);animation:scanline-drift 14s linear infinite;}
#home-screen::after{content:'';position:absolute;inset:0;z-index:52;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(4,6,14,.5) 100%);animation:tv-breathe 3.5s ease-in-out infinite;}
@keyframes scanline-drift{from{background-position:0 0}to{background-position:0 100%}}
@keyframes tv-breathe{0%{opacity:.7}40%{opacity:1}70%{opacity:.85}100%{opacity:.7}}
.mp-card{background:linear-gradient(145deg,rgba(14,17,32,.94),rgba(6,8,16,.96));border:1px solid rgba(var(--acc-rgb),.18);border-radius:20px;padding:36px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(var(--acc-rgb),.06);max-width:420px;width:100%;text-align:center;position:relative;z-index:60;}
.mp-icon{font-size:2.8rem;line-height:0}
.mp-logo{width:96px;height:96px;filter:drop-shadow(0 10px 28px rgba(var(--acc-rgb),.35))}
.mp-title{font-size:1.1rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;font-family:var(--font-display);color:var(--amber);}
.mp-btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:12px;color:#000;font-size:.9rem;font-weight:800;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:.25s;}
.mp-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px var(--glow);}
.mp-sub{font-size:.75rem;color:var(--sub);}
.mp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:6px;}
.mp-card-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:linear-gradient(145deg,rgba(var(--acc-rgb),.04),rgba(var(--acc2-rgb),.02));border:1px solid rgba(var(--acc-rgb),.1);border-radius:13px;cursor:pointer;transition:all .2s;text-decoration:none;color:var(--gold);font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
.mp-card-item:hover{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border-color:transparent;box-shadow:0 6px 20px var(--glow);transform:translateY(-2px) scale(1.03);}
.mp-card-item .mci-icon{font-size:1.45rem;}
.mp-card-item.mp-wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;padding:11px 8px;}
.mp-card-item.mp-wide .mci-icon{font-size:1.15rem;}
@media(max-width:400px){.mp-grid{gap:7px;}.mp-card-item{padding:10px 6px;font-size:.68rem;}.mp-card-item .mci-icon{font-size:1.2rem;}}
body.video-fs #page-container,body.immersive #page-container{position:fixed!important;inset:0!important;z-index:2147483000!important;display:flex!important;background:#000}
body.video-fs #page-frame,body.immersive #page-frame{width:100vw!important;height:100vh!important;height:100dvh!important}
#page-container{flex:1;display:none;flex-direction:column;overflow:hidden;background:var(--bg);}
#page-container.active{display:flex;}
#page-frame{flex:1;border:none;width:100%;display:block;background:var(--bg);height:100%;min-height:0;}
#musik-bg-frame{height:100%;min-height:0;}
.gbar-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);background:rgba(var(--acc-rgb),.07);color:var(--gold);border-radius:9px;cursor:pointer;font-size:.78rem;font-weight:700;transition:all .2s;white-space:nowrap;}
.gbar-btn:hover{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border-color:transparent;box-shadow:0 3px 12px var(--glow);}
.gbar-btn.danger{border-color:rgba(244,63,94,.3);color:var(--red);background:rgba(244,63,94,.07);}
.gbar-btn.danger:hover{background:var(--red);color:#fff;}
.gbar-btn.refresh-btn{min-width:0;padding:4px 9px;font-size:.73rem;border-radius:9px;gap:4px;min-height:32px;}
.gbar-btn.refresh-btn .ricon{transition:transform .3s;display:inline-block;}
.qa-bar{flex-shrink:0;background:linear-gradient(0deg,rgba(4,6,14,.99),rgba(8,11,22,.98));border-top:1px solid rgba(var(--acc-rgb),.12);box-shadow:0 -4px 24px rgba(0,0,0,.4);overflow:hidden;position:relative;}
.qa-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--acc-rgb),.25) 35%,rgba(var(--hl-rgb),.18) 55%,transparent);pointer-events:none;}
.qa-header{display:flex;align-items:center;justify-content:center;padding:5px 16px;cursor:pointer;user-select:none;position:relative;gap:6px;}
.qa-label{font-size:.56rem;color:var(--sub);text-transform:uppercase;letter-spacing:2.5px;font-weight:800;display:flex;align-items:center;gap:5px;transition:color .2s;}
.qa-header:hover .qa-label{color:var(--gold);}
.qa-toggle-arrow{color:var(--gold);font-size:.6rem;display:inline-block;transition:transform .35s cubic-bezier(.4,0,.2,1);opacity:.7;}
.qa-bar.collapsed .qa-toggle-arrow{transform:rotate(180deg);}
.qa-body{max-height:116px;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1),padding .35s,opacity .28s;padding:0 0 8px;opacity:1;}
.qa-bar.collapsed .qa-body{max-height:0;padding-bottom:0;opacity:0;}
#qa-chat-notify{display:none;align-items:center;gap:6px;position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;}
#qa-chat-notify.show{display:flex;}
.qa-notify-bubble{font-size:1.1rem;animation:qa-bounce .6s ease infinite alternate;}
@keyframes qa-bounce{from{transform:scale(1) rotate(-8deg)}to{transform:scale(1.18) rotate(5deg)}}
.qa-notify-count{background:var(--red);color:#fff;font-size:.58rem;font-weight:900;padding:2px 6px;border-radius:20px;min-width:18px;text-align:center;box-shadow:0 0 8px rgba(244,63,94,.5);}
@keyframes qa-header-glow{0%,100%{background:transparent}50%{background:rgba(var(--acc-rgb),.05)}}
.qa-bar.has-notify .qa-header{animation:qa-header-glow 1.4s ease-in-out infinite;}
.qa-bar.has-notify .qa-label{color:var(--gold)!important;}
.qa-swipe-wrap{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;height:94px;}
.qa-swipe-wrap::-webkit-scrollbar{display:none;}
.qa-panel{flex-shrink:0;scroll-snap-align:start;display:flex;align-items:center;padding:0 10px;}
.qa-panel-links{gap:6px;overflow:hidden;}
.qa-scroll{display:flex;gap:7px;overflow-x:auto;padding:3px 2px 5px;align-items:center;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1;}
.qa-scroll::-webkit-scrollbar{display:none;}
.qa-dots{display:none;justify-content:center;align-items:center;gap:8px;padding:4px 0 2px;}
.qa-dot{height:3px;border-radius:3px;background:rgba(var(--acc-rgb),.18);cursor:pointer;transition:all .3s;width:18px;}
.qa-dot.active{background:linear-gradient(90deg,var(--gold),var(--gold2));width:30px;box-shadow:0 0 8px var(--glow);}
.qa-sep{width:1px;height:44px;background:linear-gradient(180deg,transparent,rgba(var(--acc-rgb),.18),transparent);flex-shrink:0;}
.qa-swipe-label{font-size:.48rem;color:rgba(var(--acc-rgb),.25);text-transform:uppercase;letter-spacing:1.5px;margin-right:5px;white-space:nowrap;}
@media(min-width:641px){.qa-swipe-wrap{overflow-x:visible;flex-wrap:nowrap;height:auto;padding:4px 14px 0;gap:12px;align-items:center;}.qa-panel{flex-shrink:0;scroll-snap-align:unset;padding:0;height:auto;}.qa-panel-player{order:0;flex-shrink:0;}.qa-panel-links{order:1;flex:1;overflow:hidden;}.qa-dots{display:none!important;}.qa-swipe-label{display:none;}}
@media(max-width:640px){.qa-swipe-wrap{width:100%;}.qa-panel{width:100vw;flex-shrink:0;padding:0 10px;}.qa-panel-links{order:0;align-items:center;}.qa-panel-player{order:1;justify-content:center;}.qa-radio{min-width:0;max-width:100%;width:100%;}.qa-dots{display:flex;}.qa-body{padding:0 0 4px;}}
.qa-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 12px;background:linear-gradient(145deg,rgba(var(--acc-rgb),.04),rgba(6,8,16,.6));border:1px solid rgba(var(--acc-rgb),.13);border-radius:13px;color:var(--gold);cursor:pointer;transition:all .18s cubic-bezier(.4,0,.2,1);text-decoration:none;font-size:.64rem;font-weight:800;text-transform:uppercase;white-space:nowrap;min-width:62px;min-height:64px;justify-content:center;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(var(--acc-rgb),.06);}
.qa-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);border-radius:13px 13px 0 0;pointer-events:none;}
.qa-btn:hover{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border-color:transparent;box-shadow:0 6px 24px var(--glow);transform:translateY(-2px) scale(1.03);}
.qa-btn:active{transform:translateY(0) scale(.96);box-shadow:none;}
.qa-btn .qa-btn-icon{font-size:1.25rem;line-height:1.1;}
.qa-btn span:last-child{font-size:.58rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;}
.qa-chat-btn .qa-chat-icon{font-size:1.4rem;display:block;transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.qa-chat-btn:hover .qa-chat-icon{transform:scale(1.15);}
.qa-chat-btn.active{background:var(--gold)!important;color:#000!important;box-shadow:0 0 18px var(--glow);}
#mc-panel{z-index:7000!important;}
#mc-toggle{display:none!important;}
.qa-radio{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(14,17,32,.97),rgba(6,8,16,.99));border:1px solid rgba(var(--acc-rgb),.14);border-radius:14px;padding:8px 10px 8px 14px;width:320px;min-width:320px;max-width:320px;box-shadow:0 4px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(var(--acc-rgb),.05);flex-shrink:0;position:relative;transition:opacity .7s,filter .7s;}
.qa-radio::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:linear-gradient(180deg,var(--amber),var(--amber2));border-radius:0 3px 3px 0;box-shadow:0 0 10px var(--amber-glow);}
.qa-radio.offline{opacity:.22;filter:grayscale(1) brightness(.45);}
.qa-radio.offline *{pointer-events:none!important;cursor:not-allowed!important;}
.qr-cover{width:42px;height:42px;flex-shrink:0;border-radius:9px;background:linear-gradient(135deg,#1A2040,#0E1428);border:1px solid rgba(var(--acc-rgb),.14);display:flex;align-items:center;justify-content:center;font-size:1.3rem;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.4);}
.qr-cover.spinning::after{content:'';position:absolute;inset:0;background:conic-gradient(rgba(var(--acc-rgb),.08) 0deg,transparent 180deg);animation:qr-spin 3s linear infinite;}
@keyframes qr-spin{to{transform:rotate(360deg)}}
.qr-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.qr-pl-row{display:flex;align-items:center;gap:3px;}
.qr-pl-name{flex:1;font-size:.56rem;font-weight:700;color:rgba(var(--acc-rgb),.4);letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qr-pl-btn{background:rgba(var(--acc-rgb),.05);border:1px solid rgba(var(--acc-rgb),.1);border-radius:4px;color:rgba(var(--acc-rgb),.4);font-size:.55rem;cursor:pointer;padding:1px 4px;line-height:1.4;transition:all .15s;}
.qr-pl-btn:hover{background:rgba(var(--acc-rgb),.12);color:var(--gold);border-color:rgba(var(--acc-rgb),.3);}
.qr-track-box{overflow:hidden;background:rgba(0,0,0,.35);border:1px solid rgba(var(--acc-rgb),.07);border-radius:6px;padding:3px 7px;cursor:default;position:relative;}
.qr-track-box::after{content:'';position:absolute;right:0;top:0;bottom:0;width:18px;background:linear-gradient(90deg,transparent,rgba(6,8,16,.95));pointer-events:none;opacity:0;transition:opacity .2s;}
.qr-track-box.overflow::after{opacity:1;}
.qr-track{font-size:.76rem;font-weight:700;color:var(--txt);white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis;}
/* Laufschrift: lange Titel wandern endlos von rechts nach links */
.qr-track.marquee{overflow:visible;text-overflow:clip;display:inline-flex;animation:qr-marquee var(--marquee-dur,12s) linear infinite;will-change:transform}
.qr-track.marquee span{padding-right:2.5em}
.qr-track-box:hover .qr-track.marquee{animation-play-state:paused}

.soo-icon{font-size:2.5rem;filter:grayscale(1);opacity:.3;animation:tv-breathe 4s ease-in-out infinite;}
.soo-text{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:rgba(255,255,255,.16);}
.soo-sub{font-size:.55rem;color:rgba(255,255,255,.08);}

@keyframes soo-dot-pulse{0%,100%{opacity:.1;transform:scale(.8)}50%{opacity:.6;transform:scale(1.25)}}
.content-area.tv-shutting-off{animation:tv-shutoff-anim .45s cubic-bezier(.4,0,1,.8) forwards;transform-origin:center;will-change:transform,filter;}
.content-area.tv-offline{transform:scaleY(.0008);filter:brightness(0);visibility:hidden;}
.content-area.tv-powering-on{visibility:visible;animation:tv-poweron-anim .5s cubic-bezier(0,.6,.4,1) forwards;transform-origin:center;will-change:transform,filter;}
@keyframes tv-shutoff-anim{0%{transform:scaleY(1);filter:brightness(1) saturate(1)}25%{transform:scaleY(1);filter:brightness(2.2) saturate(.2)}55%{transform:scaleY(.012);filter:brightness(7)}78%{transform:scaleY(.002);filter:brightness(3)}100%{transform:scaleY(.0008);filter:brightness(0)}}
@keyframes tv-poweron-anim{0%{transform:scaleY(.0008);filter:brightness(0)}18%{transform:scaleY(.002);filter:brightness(5)}45%{transform:scaleY(.012);filter:brightness(7)}72%{transform:scaleY(1);filter:brightness(1.5) saturate(.55)}100%{transform:scaleY(1);filter:brightness(1) saturate(1)}}

<div id="kiosk-edge-l" aria-hidden="true"></div>
<div id="kiosk-edge-b" aria-hidden="true"></div>

<script src="/js/shortcuts.js"></script>
<script>
/* ─── Sidebar ─────────────────────────────────────────────── */
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
}

/* ─── Master Volume ──────────────────────────────────────── */
let masterVolume=0.8,_muted=false,_premuteVol=0.8;
function setMasterVolume(v){
  masterVolume=v;_muted=(v===0);
  _updateVolIcon();
  document.querySelectorAll('.ctrl-vol-slider').forEach(s=>s.value=v);
  /* Sidebar-Remote Label syncen */
  const lbl=document.getElementById('srmt-vol-label');
  if(lbl)lbl.textContent=Math.round(v*100)+'%';
  _broadcastVolume(v);
}
function toggleMute(){
  if(_muted){setMasterVolume(_premuteVol||0.8);}
  else{_premuteVol=masterVolume;setMasterVolume(0);}
}
function _updateVolIcon(){
  const ic=document.getElementById('ctrl-vol-icon');
  if(ic)ic.textContent=masterVolume===0?'🔇':masterVolume<0.4?'🔈':'🔊';
}
function _broadcastVolume(v){
  ['musik-bg-frame','page-frame'].forEach(id=>{
    try{document.getElementById(id)?.contentWindow?.postMessage({type:'set-volume',vol:v},'*');}catch{}
  });
}

/* ─── Media Mutex – nur ein Medium gleichzeitig ──────────── */
/* Musik läuft beim Seitenwechsel weiter – sie stoppt nur, wenn ein Film oder eine Serie startet */
function _pauseMusic(){
  try{document.getElementById('musik-bg-frame')?.contentWindow?.postMessage({type:'media-pause-all'},'*');}catch{}
}
function _pauseAllMedia(){
  ['page-frame'].forEach(id=>{
    try{document.getElementById(id)?.contentWindow?.postMessage({type:'media-pause-all'},'*');}catch{}
  });
}

/* ─── QA Swipe Dots ─────────────────────────────────────── */
function qaSwipeTo(idx){
  const wrap=document.getElementById('qa-swipe-wrap');
  if(!wrap)return;
  const panels=wrap.querySelectorAll('.qa-panel');
  if(panels[idx])wrap.scrollTo({left:panels[idx].offsetLeft,behavior:'smooth'});
}
(function(){
  const wrap=document.getElementById('qa-swipe-wrap');
  if(!wrap)return;
  let ticking=false;
  wrap.addEventListener('scroll',()=>{
    if(ticking)return;ticking=true;
    requestAnimationFrame(()=>{
      ticking=false;
      const dots=document.querySelectorAll('.qa-dot');
      const panels=wrap.querySelectorAll('.qa-panel');
      let ai=0,md=Infinity;
      panels.forEach((p,i)=>{const d=Math.abs(p.offsetLeft-wrap.scrollLeft);if(d<md){md=d;ai=i;}});
      dots.forEach((d,i)=>d.classList.toggle('active',i===ai));
    });
  },{passive:true});
})();

/* ─── QA Toggle ─────────────────────────────────────────── */
function toggleQA(){
  const bar=document.getElementById('qa-bar');
  bar.classList.toggle('collapsed');
  if(!bar.classList.contains('collapsed')){
    bar.classList.remove('has-notify');
    document.getElementById('qa-chat-notify')?.classList.remove('show');
  }
}
document.getElementById('qa-bar')?.classList.add('collapsed');

/* ─── Navigation ────────────────────────────────────────── */
const PAGE_LABELS={
  '':'🏠 Home','FILME.html':'🎬 Filme','SERIEN.html':'📺 Serien',
  'MUSIK.html':'🎵 Musik','FOTOS.html':'🖼️ Fotos',
  'SPIELE.html':'🎮 Spiele','SPIELE.html#lan':'🎮 Spiele – Lobby','upload.html':'📤 Upload','EINSTELLUNGEN.html':'⚙️ Einstellungen',
};
const NAV_MAP={
  '':'nav-home','FILME.html':'nav-filme','SERIEN.html':'nav-serien',
  'MUSIK.html':'nav-musik','FOTOS.html':'nav-fotos',
  'SPIELE.html':'nav-spiele','SPIELE.html#lan':'nav-spiele','upload.html':'nav-upload','EINSTELLUNGEN.html':'nav-settings',
};
let currentSrc='';
let currentLabel='';

function loadPage(src,label){
  document.body.classList.remove('immersive');
  src=src||'';
  label=label||PAGE_LABELS[src]||('📄 '+src);
  {const sp=document.getElementById('desktop-section-pill');if(sp)sp.textContent=(src?label:'Startseite').replace(/^[^\p{L}\p{N}]+/u,'').trim()||'Startseite';}

  const home=document.getElementById('home-screen');
  const pc=document.getElementById('page-container');
  const bgMusik=document.getElementById('musik-bg-frame');

  // Eigene Webseiten (Schnellzugriff) – Musik läuft im Hintergrund weiter
  if(window.MCWeb&&MCWeb.isWeb(src)){
    try{document.getElementById('page-frame')?.contentWindow?.postMessage({type:'media-pause-all'},'*');}catch{}
    home.style.display='none';pc.classList.remove('active');bgMusik.style.display='none';
    document.getElementById('page-frame').src='';
    MCWeb.open(src,label);
    currentSrc=src;currentLabel=label;
    setActiveNav('');_syncCtrlBar();
    return;
  }
  if(window.MCWeb)MCWeb.hide();

  // Home
  if(!src){
    _pauseAllMedia();
    pc.classList.remove('active');
    bgMusik.style.display='none';
    home.style.display='flex';
    currentSrc='';currentLabel='';
    setActiveNav('nav-home');
    _syncCtrlBar();
    return;
  }

  // Media-Mutex: Nicht-Musik pausieren wenn Musik startet, und umgekehrt
  if(src==='MUSIK.html'){
    // Video-Seiten pausieren
    try{document.getElementById('page-frame')?.contentWindow?.postMessage({type:'media-pause-all'},'*');}catch{}
    home.style.display='none';
    pc.classList.remove('active');
    document.getElementById('page-frame').src='';
    bgMusik.style.display='block';
    currentSrc=src;currentLabel=label;
    setActiveNav('nav-musik');
    _syncCtrlBar();
    // Volume übertragen
    setTimeout(()=>_broadcastVolume(masterVolume),800);
    return;
  }

  // Alle anderen Seiten: Musik bleibt im Hintergrund (wird automatisch pausiert wenn Video startet)
  bgMusik.style.display='none';
  home.style.display='none';
  const frame=document.getElementById('page-frame');
  if(frame.src!==src && !(frame.src.endsWith('/'+src))){
    frame.src=src;
  }
  pc.classList.add('active');
  currentSrc=src;currentLabel=label;

  const navKey=Object.keys(NAV_MAP)
    .filter(k=>k!==''&&src.startsWith(k.split('#')[0]))
    .sort((a,b)=>b.length-a.length)[0]||'';
  setActiveNav(NAV_MAP[navKey]||'');
  _syncCtrlBar();
  // Volume übertragen
  setTimeout(()=>_broadcastVolume(masterVolume),800);
}

function setActiveNav(id){
  document.querySelectorAll('.sidebar .nav-item').forEach(b=>b.classList.remove('active'));
  if(id){const el=document.getElementById(id);if(el)el.classList.add('active');}
}

/* ─── Vollbild & Kiosk ──────────────────────────────────────
   normal     – Fenster wie gewohnt
   fullscreen – ganze App bildschirmfüllend (wie F11), alles bleibt bedienbar
   kiosk      – bildschirmfüllend, nur der Inhalt; Menüleisten erscheinen am Rand oder über „⋯“
   Unabhängig davon kann ein Video bildschirmfüllend laufen (video-fs).
   Der Bildschirm bleibt im Vollbild, solange eines davon aktiv ist. */
const _E=window.electron;
let appMode='normal',_videoFs=false,_winFs=false,_wantFs=false,_fsAt=0;
const _fsApi=!!(_E&&_E.setFullscreen)||!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function _docFs(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function _screenFs(on){
  _wantFs=on;_fsAt=Date.now();
  if(_E&&_E.setFullscreen){_E.setFullscreen(on);return;}
  try{
    if(on){if(!_docFs()){const el=document.documentElement;const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(r&&r.catch)r.catch(()=>{});}}
    else if(_docFs()){const r=(document.exitFullscreen||document.webkitExitFullscreen).call(document);if(r&&r.catch)r.catch(()=>{});}
  }catch{}
}
function _applyScreen(){_screenFs(appMode!=='normal'||_videoFs);}
function setAppMode(m,fromScreen){
  if(m!=='fullscreen'&&m!=='kiosk')m='normal';
  appMode=m;
  document.body.classList.toggle('app-fs',m!=='normal');
  document.body.classList.toggle('kiosk',m==='kiosk');
  if(m!=='kiosk')kioskReveal(false);
  if(!fromScreen)_applyScreen();
  try{sessionStorage.setItem('mc_mode',m);}catch{}
  _syncCtrlBar();
}
function toggleFullscreen(){setAppMode(appMode==='fullscreen'?'normal':'fullscreen');}
function toggleKiosk(){setAppMode(appMode==='kiosk'?'normal':'kiosk');}
function enterKiosk(){setAppMode('kiosk');}
function exitKiosk(){if(appMode==='kiosk')setAppMode('normal');}
function closeFsOverlay(){if(appMode!=='normal')setAppMode('normal');}

/* Bildschirm-Vollbild wurde von außen geändert (Esc, F11, Betriebssystem, Spiel-Vollbild) */
function _onScreenFs(on){
  _winFs=on;
  if(Date.now()-_fsAt<1500&&on!==_wantFs)return; // Übergang läuft noch
  if(!on){
    if(_videoFs)setVideoFs(false,true);
    if(appMode!=='normal')setAppMode('normal',true);
  }else if(appMode==='normal'&&!_videoFs){
    setAppMode('fullscreen',true); // z. B. F11 → Knopf zeigt „Vollbild beenden“
  }
  _wantFs=on;
}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!_E)_onScreenFs(!!_docFs());}));
_E?.onWindowState?.(st=>{if(st&&typeof st.fullscreen==='boolean'&&st.fullscreen!==_winFs)_onScreenFs(st.fullscreen);});
Promise.resolve(_E?.getWindowState?.()).then(st=>{if(st)_winFs=!!st.fullscreen;}).catch(()=>{});
let _vfOffAt=0;
function _onEscape(){
  if(_videoFs){setVideoFs(false);return;}
  if(Date.now()-_vfOffAt<500)return;          // Esc hat gerade schon das Video-Vollbild beendet
  if(document.querySelector('#mc-overlay.open #mc-panel:focus-within'))return; // Esc schließt den Chat
  if(appMode!=='normal')setAppMode('normal');
}
// Esc im Hauptfenster; aus den Seiten meldet es esc-bridge.js per postMessage {type:'esc'}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.defaultPrevented)_onEscape();});

/* Kiosk: Leisten einblenden, wenn die Maus an den Rand fährt oder „⋯“ getippt wird */
let _kioskT=0;const _canHover=matchMedia('(hover: hover)');
function kioskReveal(on){
  clearTimeout(_kioskT);
  document.body.classList.toggle('kiosk-reveal',!!on&&appMode==='kiosk');
  if(on&&appMode==='kiosk')_kioskT=setTimeout(_kioskMaybeHide,3500);
}
function _kioskMaybeHide(){
  const hov=document.querySelector('.ctrl-bar:hover,.sidebar:hover,.qa-bar:hover');
  const foc=document.querySelector('.ctrl-bar :focus-visible,.sidebar :focus-visible,.qa-bar :focus-visible');
  if(hov||foc){_kioskT=setTimeout(_kioskMaybeHide,1500);return;}
  kioskReveal(false);
}
document.getElementById('kiosk-edge').addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&_canHover.matches)kioskReveal(true);});
document.getElementById('kiosk-edge-l').addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&_canHover.matches)kioskReveal(true);});
document.getElementById('kiosk-edge-b').addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&_canHover.matches)kioskReveal(true);});
document.getElementById('kiosk-menu').addEventListener('click',()=>kioskReveal(true));
document.addEventListener('pointerdown',e=>{
  if(appMode==='kiosk'&&document.body.classList.contains('kiosk-reveal')&&!e.target.closest('.ctrl-bar,.sidebar,.qa-bar,#kiosk-menu,#mc-overlay'))kioskReveal(false);
},true);

/* ─── Ctrl-Bar Sync ──────────────────────────────────────── */
function _syncCtrlBar(){
  const fsBtn=document.getElementById('ctrl-fs-btn');
  const kBtn=document.getElementById('ctrl-kiosk-btn');
  if(fsBtn){
    fsBtn.style.display=_fsApi?'inline-flex':'none';
    fsBtn.style.opacity='';fsBtn.style.pointerEvents='';
    const inFs=appMode==='fullscreen';
    fsBtn.classList.toggle('active',inFs);
    fsBtn.title=inFs?'Vollbild beenden (Esc)':'Vollbild (F11)';
    document.getElementById('ctrl-fs-icon').textContent=inFs?'⊠':'⛶';
    document.getElementById('ctrl-fs-label').textContent=inFs?' Vollbild beenden':' Vollbild';
  }
  if(kBtn){
    kBtn.style.display='inline-flex';
    const inKiosk=appMode==='kiosk';
    kBtn.classList.toggle('active',inKiosk);
    kBtn.title=inKiosk?'Kiosk beenden (Esc)':'Kiosk – nur Inhalt, bildschirmfüllend';
    kBtn.querySelector('.ci').textContent=inKiosk?'🪟':'📺';
    kBtn.querySelector('.btn-label').textContent=inKiosk?' Kiosk beenden':' Kiosk';
  }
}

/* ─── Video-Vollbild: Seiten-iFrame füllt den ganzen Bildschirm ─── */
function _tellFrames(msg){['page-frame'].forEach(id=>{try{document.getElementById(id)?.contentWindow?.postMessage(msg,'*');}catch{}});}
function setVideoFs(on,fromScreen){
  on=!!on;
  if(on===_videoFs)return;
  _videoFs=on;
  if(!on)_vfOffAt=Date.now();
  document.body.classList.toggle('video-fs',on);
  if(on)kioskReveal(false);
  if(!fromScreen)_applyScreen(); // im Vollbild/Kiosk bleibt der Bildschirm im Vollbild
  _tellFrames({type:'player-fs-state',on});
}

/* ─── postMessage von iFrames ────────────────────────────── */
window.addEventListener('message',e=>{
  const d=e.data;
  if(!d||typeof d!=='object') return;
  if(d.type==='openPage')   loadPage(d.url,d.label);
  if(d.type==='openGame')   loadPage(d.url||'SPIELE.html#lan','🎮 Spiele');
  if(d.type==='videoPlaying') _pauseMusic();
  if(d.type==='player-fullscreen') setVideoFs(!!d.on);
  if(d.type==='videoStopped') setVideoFs(false);
  if(d.type==='app-immersive') document.body.classList.toggle('immersive',!!d.on);
  if(d.type==='fullscreen') toggleFullscreen();
  if(d.type==='esc'&&e.source===document.getElementById('page-frame')?.contentWindow) _onEscape();
  if(d.type==='esc'&&e.source===document.getElementById('musik-bg-frame')?.contentWindow) _onEscape();
  if(d.type==='navigate') loadPage(d.page||'',d.label||'');
  if(d.type==='radio-status'){
    const s=d;
    qaRadioState={
      isPlaying:s.isPlaying,trackName:s.trackName||'',
      plName:s.plName||'🎵 Alle Songs',plIdx:s.plIdx||0,
      playlists:s.playlists||[],total:s.total||0,
      currentTime:s.currentTime||0,duration:s.duration||0,
    };
    qaRadioUpdateDisplay();
  }
  /* Volume-Anfrage von iFrame → Parent antwortet mit aktuellem Volume */
  if(d.type==='get-volume'){
    try{e.source.postMessage({type:'set-volume',vol:masterVolume},'*');}catch{}
  }
});

/* ─── Quick Access – eigene Seiten: siehe /js/shortcuts.js ─── */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─── Media Player Controller ────────────────────────────── */
let qaRadioState={isPlaying:false,trackName:'',plName:'─ ─ ─',plIdx:0,playlists:[],total:0,currentTime:0,duration:0};
let qaRadioScrollTimer=null;

function getMusikFrame(){
  return document.getElementById('musik-bg-frame')?.contentWindow||null;
}
function qaRadioCmd(cmd){
  const fw=getMusikFrame();
  if(fw)fw.postMessage({type:'radio-cmd',cmd},'*');
}
function qaRadioPl(dir){
  const pls=qaRadioState.playlists;
  if(!pls.length){qaRadioCmd('status');return;}
  const next=((qaRadioState.plIdx+dir)+pls.length)%pls.length;
  const fw=getMusikFrame();
  if(fw)fw.postMessage({type:'radio-cmd',cmd:'selectPl',plIdx:next},'*');
}

function fmtTime(s){
  if(!s||isNaN(s))return'0:00';
  const m=Math.floor(s/60),sec=Math.floor(s%60);
  return m+':'+(sec<10?'0':'')+sec;
}

function qaRadioUpdateDisplay(){
  const s=qaRadioState;
  document.getElementById('qr-pl-name').textContent=s.plName||'─ ─ ─';
  const trackEl=document.getElementById('qr-track');
  const trackBox=document.getElementById('qr-track-box');
  const txt=s.trackName||(s.isPlaying?'...':'Kein Song');

  if(trackEl.dataset.txt!==txt){
  trackEl.dataset.txt=txt;
  trackEl.classList.remove('marquee');
  trackEl.style.removeProperty('--marquee-dur');
  trackEl.textContent=txt;
  trackEl.title=txt;

  clearTimeout(qaRadioScrollTimer);
  qaRadioScrollTimer=setTimeout(()=>{
    if(!trackBox)return;
    // passt der Titel nicht in die (feste) Breite → endlose Laufschrift, zweimal hintereinander für nahtlosen Übergang
    if(trackEl.scrollWidth>trackBox.clientWidth-12){
      const t=esc(txt);
      trackEl.innerHTML='<span>'+t+'</span><span aria-hidden="true">'+t+'</span>';
      trackEl.classList.add('marquee');
      const half=trackEl.scrollWidth/2;
      trackEl.style.setProperty('--marquee-dur',Math.max(6,half/32).toFixed(1)+'s');
    }
  },60);
  }

  const statEl=document.getElementById('qr-status');
  const playBtn=document.getElementById('qr-play-btn');
  const cover=document.getElementById('qr-cover');
  if(s.isPlaying){
    statEl.textContent='▶';statEl.className='qr-status playing';
    playBtn.textContent='⏸';playBtn.classList.add('active');
    cover?.classList.add('spinning');
  } else {
    statEl.textContent='■';statEl.className='qr-status';
    playBtn.textContent='▶';playBtn.classList.remove('active');
    cover?.classList.remove('spinning');
  }

  // Seekbar
  if(!qrDragging){
    const pct=s.duration>0?Math.min(s.currentTime/s.duration,1):0;
    const fill=document.getElementById('qr-prog-fill');
    if(fill)fill.style.width=(pct*100)+'%';
  }
  document.getElementById('qr-t-cur').textContent=s.duration>0?fmtTime(s.currentTime):'0:00';
  document.getElementById('qr-t-tot').textContent=s.duration>0?fmtTime(s.duration):'0:00';
}

/* Seek */
let qrDragging=false;
function qaSeekPct(pct){
  const fw=getMusikFrame();
  if(fw)fw.postMessage({type:'radio-cmd',cmd:'seek',pct},'*');
  const fill=document.getElementById('qr-prog-fill');
  if(fill)fill.style.width=(pct*100)+'%';
  if(qaRadioState.duration>0)
    document.getElementById('qr-t-cur').textContent=fmtTime(pct*qaRadioState.duration);
}
function qaSeek(e){
  if(!qaRadioState.duration)return;
  const bar=document.getElementById('qr-prog');
  const rect=bar.getBoundingClientRect();
  const pct=Math.max(0,Math.min((e.clientX-rect.left)/rect.width,1));
  qaSeekPct(pct);qrDragging=true;
  function onMove(ev){const p=Math.max(0,Math.min((ev.clientX-rect.left)/rect.width,1));document.getElementById('qr-prog-fill').style.width=(p*100)+'%';}
  function onUp(ev){qrDragging=false;qaSeekPct(Math.max(0,Math.min((ev.clientX-rect.left)/rect.width,1)));document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);}
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}
function qaSeekTouch(e){
  if(!qaRadioState.duration)return;
  e.preventDefault();
  const bar=document.getElementById('qr-prog');
  const rect=bar.getBoundingClientRect();
  function getPct(ev){const t=ev.touches[0]||ev.changedTouches[0];return Math.max(0,Math.min((t.clientX-rect.left)/rect.width,1));}
  qrDragging=true;
  function onMove(ev){document.getElementById('qr-prog-fill').style.width=(getPct(ev)*100)+'%';}
  function onEnd(ev){qrDragging=false;qaSeekPct(getPct(ev));document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);}
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('touchend',onEnd);
}

/* Auto-Pause Musik wenn Video spielt – Resume NUR wenn Musik vorher aktiv war */
let _vidPaused=false;
let _musicWasPlaying=false;
setInterval(()=>{
  const f=document.getElementById('page-frame');
  if(!f)return;
  const src=currentSrc||'';
  if(!src.match(/FILME|SERIEN|film|serie/i))return;
  try{
    const vids=f.contentDocument?.querySelectorAll('video')||[];
    const playing=[...vids].some(v=>!v.paused&&!v.ended&&v.readyState>2);
    if(playing&&!_vidPaused){
      _vidPaused=true;
      _musicWasPlaying=qaRadioState.isPlaying; // merken ob Musik lief
      qaRadioCmd('pause');
    } else if(!playing&&_vidPaused){
      _vidPaused=false;
      if(_musicWasPlaying) qaRadioCmd('play'); // nur resume wenn Musik vorher lief
      _musicWasPlaying=false;
    }
  }catch{}
},1500);

/* ─── TV Effect Engine ───────────────────────────────────── */
const TvEffect=(function(){
  let _raf=null,_running=false;

  function canvas(){return document.getElementById('server-static-canvas2');}
  function overlay(){return document.getElementById('server-tv-overlay');}
  function ca(){return document.querySelector('.content-area');}
  function player(){return document.querySelector('.qa-radio');}
  function msg(){return document.querySelector('.soo-msg');}

  function startNoise(){
    const c=canvas();if(!c||_running)return;
    _running=true;c.classList.add('noise-active');
    const ctx=c.getContext('2d');let fc=0;
    function draw(){
      fc++;
      if(fc%3===0){
        const w=c.offsetWidth||800,h=c.offsetHeight||600;
        c.width=w;c.height=h;
        if(w&&h){
          const img=ctx.createImageData(w,h),d=img.data;
          for(let i=0;i<d.length;i+=4){
            const g=Math.random();
            if(g>.58){const v=50+Math.random()*45;d[i]=v;d[i+1]=v*.92;d[i+2]=v*.8;d[i+3]=g*g*22;}
          }
          ctx.putImageData(img,0,0);
        }
      }
      _raf=requestAnimationFrame(draw);
    }
    draw();
  }
  function stopNoise(){
    _running=false;if(_raf){cancelAnimationFrame(_raf);_raf=null;}
    const c=canvas();if(c)c.classList.remove('noise-active');
  }

  function setOfflineImmediate(){
    const c=ca(),o=overlay(),p=player(),m=msg();
    if(!c||!o)return;
    c.classList.add('tv-offline');
    o.classList.add('soo-visible');
    startNoise();
    if(p)p.classList.add('offline');
    if(m)setTimeout(()=>m.classList.add('visible'),400);
  }
  function setOnlineImmediate(){
    const c=ca(),o=overlay(),p=player(),m=msg();
    if(!c||!o)return;
    o.classList.remove('soo-visible');
    if(m)m.classList.remove('visible');
    c.classList.remove('tv-offline','tv-shutting-off','tv-powering-on');
    stopNoise();
    if(p)p.classList.remove('offline');
  }
  function turnOff(){
    const c=ca(),o=overlay(),p=player(),m=msg();
    if(!c||!o)return;
    c.classList.remove('tv-offline','tv-powering-on');
    c.classList.add('tv-shutting-off');
    if(p)p.classList.add('offline');
    setTimeout(()=>{o.classList.add('soo-visible');startNoise();},180);
    setTimeout(()=>{
      c.classList.remove('tv-shutting-off');
      c.classList.add('tv-offline');
      if(m)setTimeout(()=>m.classList.add('visible'),450);
    },460);
  }
  function turnOn(){
    const c=ca(),o=overlay(),p=player(),m=msg();
    if(!c||!o)return;
    if(m)m.classList.remove('visible');
    setTimeout(()=>{
      c.classList.remove('tv-offline','tv-shutting-off');
      c.classList.add('tv-powering-on');
      setTimeout(()=>{
        o.classList.remove('soo-visible');
        stopNoise();
      },160);
      setTimeout(()=>{
        c.classList.remove('tv-powering-on');
        if(p)p.classList.remove('offline');
      },520);
    },80);
  }

  return{turnOff,turnOn,setOfflineImmediate,setOnlineImmediate};
})();

/* ─── Server Monitor ─────────────────────────────────────── */
const ServerMonitor=(function(){
  let _status=null,_fails=0,_timer=null;
  const INTERVAL=4500,FAIL_THRESH=2;

  async function check(){
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),3000);
    try{
      const r=await fetch('/api/library',{cache:'no-store',signal:ctrl.signal});
      clearTimeout(t);
      if(r.ok){_fails=0;_setOnline();}
      else{_fails++;if(_fails>=FAIL_THRESH)_setOffline();}
    }catch{
      clearTimeout(t);
      _fails++;if(_fails>=FAIL_THRESH)_setOffline();
    }
  }
  function _setOnline(){
    if(_status===true)return;
    const was=_status;_status=true;
    if(was===false)TvEffect.turnOn();
    else TvEffect.setOnlineImmediate();
  }
  function _setOffline(){
    if(_status===false)return;
    const was=_status;_status=false;
    if(was===true)TvEffect.turnOff();
    else TvEffect.setOfflineImmediate();
  }
  function start(){check();_timer=setInterval(check,INTERVAL);}

  return{start};
})();

/* ─── TV Static ────────────────────────────────────────── */
(function(){
  const canvas=document.getElementById('tv-static-canvas');
  const ctx=canvas.getContext('2d');
  let rafId=null,running=false,fc=0;
  function resize(){canvas.width=canvas.offsetWidth||800;canvas.height=canvas.offsetHeight||600;}
  function drawFrame(){
    fc++;
    if(fc%3===0){
      const w=canvas.width,h=canvas.height;
      if(w&&h){
        const img=ctx.createImageData(w,h),d=img.data;
        for(let i=0;i<d.length;i+=4){
          const g=Math.random();
          if(g>0.55){
            const v=180+Math.random()*75;
            d[i]=v;d[i+1]=v*.95;d[i+2]=v*.85;d[i+3]=g*g*28;
          }
        }
        ctx.putImageData(img,0,0);
      }
    }
    rafId=requestAnimationFrame(drawFrame);
  }
  function start(){if(running)return;running=true;canvas.style.display='block';resize();fc=0;drawFrame();}
  function stop(){running=false;if(rafId){cancelAnimationFrame(rafId);rafId=null;}canvas.style.display='none';}
  window.addEventListener('resize',()=>{if(running)resize();});
  const _orig=window.loadPage;
  window.loadPage=function(src,label){_orig(src,label);if(!src)start();else stop();};
  start();
})();

/* Vollbild/Kiosk nach „Neu laden“ wiederherstellen. Browser erlauben Vollbild erst nach
   einer Berührung/einem Klick – dann wird es beim ersten Tippen nachgeholt. */
function _restoreMode(m){
  setAppMode(m);
  if(_E)return;
  setTimeout(()=>{
    if(_docFs()||appMode==='normal'||!_fsApi)return;
    const btn=document.getElementById('fs-resume');
    const done=()=>{btn.hidden=true;document.removeEventListener('pointerdown',once,true);};
    const once=e=>{if(e&&e.target===btn)return;done();if(appMode!=='normal')_applyScreen();};
    btn.onclick=()=>{done();if(appMode!=='normal')_applyScreen();};
    btn.hidden=false;
    document.addEventListener('pointerdown',once,true);
    setTimeout(done,10000);
  },400);
}

/* ─── Remote Scale – passt sich an Bildschirmgröße an ────── */
(function(){
  function scaleRemote(){
    var sidebar=document.getElementById('sidebar');
    if(!sidebar||!sidebar.classList.contains('open'))return;
    var rmt=sidebar.querySelector('.sidebar-rmt');
    if(!rmt)return;
    rmt.style.transform='scale(1)';
    var rmtH=rmt.scrollHeight;
    if(rmtH<10)return;
    var spacer=sidebar.querySelector('.sidebar-rmt-spacer');
    var spacerBottom=spacer?spacer.getBoundingClientRect().bottom:sidebar.getBoundingClientRect().top+360;
    var sidebarBottom=sidebar.getBoundingClientRect().bottom;
    var available=sidebarBottom-spacerBottom-8;
    var s=Math.min(1.1,Math.max(0.52,available/rmtH));
    rmt.style.transform='scale('+s.toFixed(3)+')';
    rmt.style.marginBottom='8px';
  }
  var _origToggle=window.toggleSidebar;
  window.toggleSidebar=function(){_origToggle&&_origToggle();setTimeout(scaleRemote,50);};
  window.addEventListener('resize',scaleRemote,{passive:true});
  setTimeout(scaleRemote,200);
})();

/* ─── Master Volume ↔ iFrame bidirectional sync ─────────── */
/* Wenn iFrame meldet dass sein Audio-Level sich ändert → Parent aktualisieren */
window.addEventListener('message',function(e){
  const d=e.data;
  if(!d||typeof d!=='object')return;
  if(d.type==='volume-changed'&&typeof d.vol==='number'){
    // iFrame änderte Lautstärke → Parent-Slider synchronisieren ohne erneut zu broadcasten
    masterVolume=d.vol;_muted=(d.vol===0);_updateVolIcon();
    document.querySelectorAll('.ctrl-vol-slider').forEach(s=>s.value=d.vol);
    const lbl=document.getElementById('srmt-vol-label');
    if(lbl)lbl.textContent=Math.round(d.vol*100)+'%';
  }
},false);
