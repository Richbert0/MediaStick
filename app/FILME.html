<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Filme – MediaCenter</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/player.css">
<script src="/js/theme.js"></script>
<script src="/js/esc-bridge.js"></script>
<style>
.filter-bar{display:flex;gap:8px;padding:12px 20px;flex-wrap:wrap;align-items:center}
body{background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 50%,var(--bg) 100%);}
.filter-bar .search-wrap{flex:1;min-width:160px}
.sort-sel{padding:9px 12px;background:var(--hover);border:1.5px solid var(--border);border-radius:9px;color:var(--txt);font-size:.82rem;outline:none;cursor:pointer}
.sort-sel option{background:var(--card)}

.card-prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18);z-index:2}
.card-prog i{display:block;height:100%;background:var(--gold)}
#loader{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9900;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#loader p{color:var(--sub);font-size:.82rem}
</style>
</head>
<body>
<div class="mc-page">
  <div class="filter-bar">
    <div class="search-wrap" style="flex:1;min-width:160px">
      <span class="si">🔍</span>
      <input class="mc-input" id="srch" placeholder="Film suchen…" oninput="render()">
    </div>
    <select class="sort-sel" id="srt" onchange="render()">
      <option value="az">A–Z</option>
      <option value="za">Z–A</option>
      <option value="si">Größe ↑</option>
      <option value="sd">Größe ↓</option>
    </select>
  </div>
  <div class="mc-page-body">
    <div class="section-head">
      <span class="section-title" id="lbl">Filme</span>
    </div>
    <div class="media-grid" id="grid"></div>
  </div>
</div>

<div id="loader"><div class="mc-spinner"></div><p>Lade Bibliothek…</p></div>

<script src="/js/app.js"></script>
<script src="/js/player.js"></script>
<script src="/js/thumbs.js"></script>
<script>
var movies=[], thumbs={}, curM=null;

async function loadLib(force){
  document.getElementById('loader').style.display='flex';
  if(force){await fetch('/api/library?r='+Date.now()).catch(()=>{});}
  var lib=await MC.loadLibrary();
  var th=await MC.api('/api/thumbnail');
  thumbs=th.thumbnails||{};
  movies=lib.movies||[];
  document.getElementById('loader').style.display='none';
  render();
  // fehlende Vorschaubilder im Hintergrund erzeugen
  var rt=0;
  movies.forEach(function(m){if(!thumbs[m.path]&&!m.thumbnail)MCThumb.auto(m.path,m.path,function(p){thumbs[m.path]=p;clearTimeout(rt);rt=setTimeout(render,300);});});
}

function getFiltered(){
  var q=(document.getElementById('srch').value||'').toLowerCase();
  var s=document.getElementById('srt').value;
  var l=q?movies.filter(m=>m.name.toLowerCase().includes(q)):movies.slice();
  if(s==='az')l.sort((a,b)=>a.name.localeCompare(b.name));
  else if(s==='za')l.sort((a,b)=>b.name.localeCompare(a.name));
  else if(s==='si')l.sort((a,b)=>a.size-b.size);
  else if(s==='sd')l.sort((a,b)=>b.size-a.size);
  return l;
}

function render(){
  var list=getFiltered();
  document.getElementById('lbl').textContent=list.length+' Film'+(list.length!==1?'e':'');
  var g=document.getElementById('grid');
  if(!list.length){
    g.innerHTML='<div class="empty-state" style="grid-column:1/-1">'
      +'<div class="es-icon">🎬</div>'
      +'<div class="es-title">Keine Filme gefunden</div>'
      +'<div class="es-sub">Noch keine Filme vorhanden. Lade MP4, MKV, AVI oder WebM-Dateien hoch.</div>'
      +'<button class="es-upload-btn" onclick="window.parent&&window.parent.postMessage({type:\'navigate\',page:\'upload.html\',label:\'☁️ Upload\'},\'*\')">'
      +'<span class="eu-icon">☁️</span> Jetzt Filme hochladen</button>'
      +'</div>';
    g._l=[];return;
  }
  g._l=list;
  g.innerHTML=list.map(function(m,i){
    var tu=thumbs[m.path]?'/'+thumbs[m.path]:(m.thumbnail?'/'+m.thumbnail:null);
    var th=tu?'<img src="'+MC.esc(tu)+'" onerror="this.style.display=\'none\'" loading="lazy">'
             :'<span style="font-size:2.5rem">🎬</span>';
    var nm=m.name.replace(/\.[^.]+$/,'');
    var pr=MCProgress.get(m.path),pct=pr?(pr.done?100:MCProgress.pct(m.path)):0;
    return '<div class="media-card" onclick="play('+i+')">'
      +'<div class="card-thumb">'+th
      +'<div class="card-overlay"><div class="card-play">▶</div></div>'
      +(pct?'<div class="card-prog"><i style="width:'+pct+'%"></i></div>':'')
      +'</div>'
      +'<div class="card-info">'
      +'<div class="card-title" title="'+MC.esc(m.name)+'">'+MC.esc(nm)+'</div>'
      +'<div class="card-meta">'+MC.fmtSize(m.size)+'</div>'
      +'</div>'
      +'<div class="card-actions">'
      +'<button class="card-act-btn" onclick="event.stopPropagation();openTM('+i+')" title="Thumbnail">🖼️</button>'
      +'<button class="card-act-btn" onclick="event.stopPropagation();trash('+i+')" style="color:var(--red)">🗑️</button>'
      +'</div>'
      +'</div>';
  }).join('');
}

function gl(){return document.getElementById('grid')._l||[];}

function play(i){
  var m=gl()[i];if(!m)return;
  curM=m;
  MCPlayer.open({
    src:'/api/media?file='+encodeURIComponent(m.path),
    key:m.path,
    title:m.name.replace(/\.[^.]+$/,''),
    subtitle:'Film',
    onThumb:async function(data){var p=await MCThumb.upload(m.path,data);if(p){thumbs[m.path]=p;render();}return !!p;},
    onEnded:function(){MCPlayer.card({center:true,title:'Film zu Ende',text:m.name.replace(/\.[^.]+$/,''),buttons:[{label:'Nochmal ansehen',run:function(){MCProgress.clear(m.path);play(i);}},{label:'Zurück zur Übersicht',primary:true,run:MCPlayer.close}]});},
    onClose:function(){curM=null;render();}
  });
}

async function trash(i){
  var m=gl()[i];if(!m||!confirm('In Papierkorb: '+m.name+'?'))return;
  var r=await MC.api('/api/trash',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'move',path:m.path,type:'video'})});
  if(r.success){MC.toast('🗑️ Verschoben','ok');movies=movies.filter(x=>x.path!==m.path);render();}
  else MC.toast('Fehler: '+r.error,'err');
}

function openTM(i){
  var m=gl()[i];if(!m)return;
  MCThumb.open({path:m.path,name:m.name,onSaved:function(p){thumbs[m.path]=p;render();}});
}

/* Volume vom Parent anfordern */
try{window.parent.postMessage({type:'get-volume'},'*');}catch{}
loadLib();
</script>
</body>
</html>
