name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows portable
            script: build:win
            artifact: dist/*.exe
            exe: dist/win-unpacked/MediaCenter.exe
            upload: MediaCenter-Windows
          - os: ubuntu-latest
            name: Linux AppImage
            script: build:linux
            artifact: dist/*.AppImage
            exe: dist/linux-unpacked/mediacenter
            upload: MediaCenter-Linux
          # Raspberry Pi 4/5 & andere ARM64-Geräte – nativ auf einem ARM-Runner gebaut und getestet
          - os: ubuntu-24.04-arm
            name: Linux AppImage ARM64 (Raspberry Pi)
            script: build:linux-arm64
            artifact: dist/*.AppImage
            exe: dist/linux-arm64-unpacked/mediacenter
            upload: MediaCenter-Linux-ARM64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Paket bauen
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Optional: Code-Signatur für Windows (siehe docs/SIGNIEREN.md).
          # Ohne diese Secrets wird unsigniert gebaut.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # ── Kostenlose Code-Signatur über die SignPath Foundation (siehe docs/SIGNIEREN.md) ──
      - name: SignPath-Signatur verfügbar?
        id: sign
        shell: bash
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$SIGNPATH_TOKEN" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signatur über SignPath aktiv."
          else
            echo "Keine Signatur (SignPath nicht eingerichtet, kein Push oder nicht Windows)."
          fi
      - name: Unsignierte EXE für SignPath bereitstellen
        if: steps.sign.outputs.enabled == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: MediaCenter-Windows-unsigniert
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1
      - name: EXE mit SignPath signieren
        if: steps.sign.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'MediaStick' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
      - name: Signierte EXE übernehmen und prüfen
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Copy-Item -Force signed/*.exe dist/
          Get-ChildItem dist/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) – $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "Signatur ungültig: $($sig.Status)" }
          }

      - name: Smoke-Test (Server-Modus der gepackten App)
        shell: bash
        run: |
          export MEDIACENTER_DATA_DIR="$RUNNER_TEMP/mc-data"
          export MEDIACENTER_PORT=18080
          EXE="${{ matrix.exe }}"
          [ -e "$EXE" ] || EXE=$(ls dist/*-unpacked/mediacenter 2>/dev/null | head -1)
          file "$EXE" 2>/dev/null || true
          "$EXE" --server --no-sandbox > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/info; then echo; break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:18080/SPIELE.html
          curl -fsS -o /dev/null http://127.0.0.1:18080/games/snake.html
          cat "$RUNNER_TEMP/server.log" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub-Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Release erstellen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          ls -la release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert – Dateien und Text werden aktualisiert."
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file .github/RELEASE_NOTES.md
          else
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "MediaCenter $TAG" \
              --notes-file .github/RELEASE_NOTES.md
          fi
